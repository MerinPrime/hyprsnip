[package]
name = "hyprsnip"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprland = "0.4.0-beta.3"
libwayshot = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.11"
clap = { version = "4.0", features = ["derive"] }
wayland-client = "0.31"
wayland-cursor = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
libc = "0.2"

[lib]
name = "hyprsnip"
path = "src/lib.rs"

[[bin]]
name = "hyprsnip"
path = "src/main.rs"
